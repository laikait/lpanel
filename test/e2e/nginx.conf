# The agent side of panel Nginx, as AGENT_PROTOCOL.md §2 describes it: a
# client certificate asked for but not checked against any CA, and handed to
# PHP as SSL_CLIENT_ESCAPED_CERT. The panel matches it to the agent by
# SHA-256. One listener is enough for this protocol test; the package splits
# people (8443) from agents (8444), see packaging/templates/nginx.conf.in.
server {
    listen 8443 ssl;
    server_name panel;

    ssl_certificate     /etc/lpanel-e2e/panel.crt;
    ssl_certificate_key /etc/lpanel-e2e/panel.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_verify_client   optional_no_ca;

    client_max_body_size 1m;
    root /srv/lpanel/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        # A FastCGI param, never a header: a client cannot set it.
        fastcgi_param SSL_CLIENT_ESCAPED_CERT $ssl_client_escaped_cert;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }
}
