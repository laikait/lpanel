; The panel's own PHP-FPM master (lpanel-php-fpm.service), on Remi's php83.
; Separate from any PHP-FPM that serves customers' sites, so their pools,
; versions and restarts never touch the panel.

[global]
pid = /run/lpanel/php-fpm.pid
error_log = /var/log/lpanel/php-fpm.log
daemonize = no

[panel]
user = lpanel
group = lpanel
listen = /run/lpanel/php-fpm.sock
; Only the panel's nginx connects.
listen.owner = lpanel
listen.group = nginx
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
request_terminate_timeout = 120s

; The framework reads its own .env; nothing from the service environment.
clear_env = yes
php_admin_value[expose_php] = Off
php_admin_value[session.save_handler] = files
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[memory_limit] = 256M
php_admin_value[error_log] = /var/log/lpanel/php-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off

; phpMyAdmin, as its own user (lpanel-pma): it cannot read the panel's code,
; its .env or its sessions, and the panel's PHP cannot read phpMyAdmin's.
[pma]
user = lpanel-pma
group = lpanel-pma
listen = /run/lpanel/pma.sock
listen.owner = lpanel-pma
listen.group = nginx
listen.mode = 0660

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 60s
pm.max_requests = 500
request_terminate_timeout = 300s

clear_env = yes
php_admin_value[expose_php] = Off
php_admin_value[open_basedir] = /usr/local/lpanel-pma/phpmyadmin/:/var/lib/lpanel-pma/
php_admin_value[session.save_handler] = files
php_admin_value[session.save_path] = /var/lib/lpanel-pma/sessions
php_admin_value[upload_tmp_dir] = /var/lib/lpanel-pma/tmp
php_admin_value[sys_temp_dir] = /var/lib/lpanel-pma/tmp
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 300
php_admin_value[error_log] = /var/lib/lpanel-pma/log/error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
