# The panel's own nginx: a separate instance (lpanel-nginx.service) from any
# web server customers' sites use, so a broken site config never takes the
# panel down. Every request goes to the front controller; nginx needs no read
# access to the panel's code at all. (EL9 ships nginx 1.20, so HTTP/2 is
# switched on in the listen line, not with the newer "http2 on;".)
#
#   :7443  Admin panel (root, administrators, resellers)  /admin...
#   :7444  User panel (account owners, sub-users)          /panel...

user nginx;
worker_processes auto;
pid /run/lpanel-nginx/nginx.pid;
error_log /var/log/lpanel/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log /var/log/lpanel/nginx-access.log;
    client_body_temp_path /var/lib/lpanel/nginx/body;
    fastcgi_temp_path /var/lib/lpanel/nginx/fastcgi;
    proxy_temp_path /var/lib/lpanel/nginx/proxy;
    scgi_temp_path /var/lib/lpanel/nginx/scgi;
    uwsgi_temp_path /var/lib/lpanel/nginx/uwsgi;
    client_max_body_size 64m;

    ssl_certificate /etc/lpanel/tls/panel.crt;
    ssl_certificate_key /etc/lpanel/tls/panel.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:lpanel:10m;

    server {
        listen 7443 ssl http2;
        listen [::]:7443 ssl http2;
        server_name _;

        location = / { return 302 /admin; }
        # The User panel lives on its own port.
        location ^~ /panel { return 404; }
        location / { include /etc/lpanel/nginx/php.conf; }
    }

    server {
        listen 7444 ssl http2;
        listen [::]:7444 ssl http2;
        server_name _;

        location = / { return 302 /panel; }
        location ^~ /admin { return 404; }
        location / { include /etc/lpanel/nginx/php.conf; }
    }
}
