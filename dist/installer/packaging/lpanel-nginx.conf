# The panel's own nginx: a separate instance (lpanel-nginx.service) from any
# web server customers' sites use, so a broken site config never takes the
# panel down. Every request goes to the front controller; nginx needs no read
# access to the panel's code at all. (EL9 ships nginx 1.20, so HTTP/2 is
# switched on in the listen line, not with the newer "http2 on;".)
#
#   :7443  Admin panel (root, administrators, resellers)  /admin...
#   :7444  User panel (account owners, sub-users)          /panel...
#          and webmail (Roundcube)                         /webmail/
#   127.0.0.1:7449  mail clients' setup, from customers' sites  /mail-setup/

user nginx;
worker_processes auto;
pid /run/lpanel-nginx/nginx.pid;
error_log /var/log/lpanel/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log /var/log/lpanel/nginx-access.log;
    client_body_temp_path /var/lib/lpanel/nginx/body;
    fastcgi_temp_path /var/lib/lpanel/nginx/fastcgi;
    proxy_temp_path /var/lib/lpanel/nginx/proxy;
    scgi_temp_path /var/lib/lpanel/nginx/scgi;
    uwsgi_temp_path /var/lib/lpanel/nginx/uwsgi;
    client_max_body_size 64m;

    ssl_certificate /etc/lpanel/tls/panel.crt;
    ssl_certificate_key /etc/lpanel/tls/panel.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:lpanel:10m;

    server {
        listen 7443 ssl http2;
        listen [::]:7443 ssl http2;
        server_name _;

        location = / { return 302 /admin; }
        # The User panel lives on its own port.
        location ^~ /panel { return 404; }
        location / { include /etc/lpanel/nginx/php.conf; }
    }

    server {
        listen 7444 ssl http2;
        listen [::]:7444 ssl http2;
        server_name _;

        location = / { return 302 /panel; }
        location ^~ /admin { return 404; }

        # phpMyAdmin, entered from Databases (its own PHP pool and user).
        location = /phpmyadmin { return 301 /phpmyadmin/; }
        location ^~ /phpmyadmin/ {
            root /usr/local/lpanel-pma;
            index index.php;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy no-referrer always;
            location ~ ^/phpmyadmin/(config\.inc\.php|libraries|templates|vendor|sql|setup|src|locale/.*\.po$|composer\.|package\.json|yarn\.lock|CONTRIBUTING|README|LICENSE|ChangeLog|RELEASE-DATE) { return 404; }
            location ~ ^/phpmyadmin/.+\.php$ {
                try_files $uri =404;
                fastcgi_pass unix:/run/lpanel/pma.sock;
                include /etc/nginx/fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_param HTTPS on;
                fastcgi_param HTTP_PROXY "";
                fastcgi_read_timeout 300s;
            }
        }

        # Roundcube (its own PHP pool and user): mailbox users sign in with
        # their address; owners open it from Email with no password.
        location = /webmail { return 301 /webmail/; }
        location ^~ /webmail/ {
            alias /usr/local/lpanel-webmail/roundcube/public_html/;
            index index.php;
            add_header Referrer-Policy same-origin always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            location ~ ^/webmail/((?:index|static)\.php)(/.*)?$ {
                fastcgi_pass unix:/run/lpanel/webmail.sock;
                include /etc/nginx/fastcgi_params;
                fastcgi_param SCRIPT_FILENAME /usr/local/lpanel-webmail/roundcube/public_html/$1;
                fastcgi_param SCRIPT_NAME /webmail/$1;
                fastcgi_param PATH_INFO $2;
                fastcgi_param HTTPS on;
                fastcgi_param HTTP_PROXY "";
                fastcgi_read_timeout 300s;
            }
            location ~ \.php$ { return 404; }
        }

        location / { include /etc/lpanel/nginx/php.conf; }
    }

    # Mail clients' setup requests (autoconfig, autodiscover), passed on by
    # customers' sites from any of their names. On 127.0.0.1 only, and only
    # that part of the panel.
    server {
        listen 127.0.0.1:7449;
        server_name _;

        location ^~ /mail-setup/ { include /etc/lpanel/nginx/php.conf; }
        location / { return 404; }
    }
}
