######################################################################
# Exim for LPanel. Written by the installer; changes here are replaced
# when the installer runs again.
#
# The mail of accounts' domains is data, written by lpa, one file a
# domain (design/ARCHITECTURE.md, "Mail"):
#   owners/<domain>     the account the domain belongs to
#   local/<domain>      there when the domain's mail is delivered here
#   mailboxes/<domain>  its mailboxes
#   forwards/<domain>   its forwarders, and "*" for the catch-all
#   dkim/<domain>       its DKIM private key
#   accounts/<account>  the account's sending limit
#   smarthost           when there, outgoing mail goes through this host
#   smarthost_auth      when there, the login to it (only ever over TLS),
#                       as PLAIN sends it
#   filter              when there, mail from outside is checked by Rspamd
#   srs_secret          the key forwarded mail's senders are rewritten with
#                       (the installer makes it)
# Exim reads them on every lookup, so no change needs a reload. A domain's
# file is always found with dsearch, which only answers with a name that
# is in the folder: a name from a message never becomes a path by itself.
#
# Mailboxes live in Dovecot, which takes local deliveries over LMTP and
# checks every login, Exim's included.
######################################################################

DATA = /etc/exim/lpanel

# The account an address's domain belongs to, or nothing.
OWNER_OF_LOGIN   = ${lookup{${lc:${domain:$authenticated_id}}}dsearch{DATA/owners}{${lookup{owner}lsearch{DATA/owners/$value}}}{}}
OWNER_OF_SENDER = ${lookup{${lc:$sender_address_domain}}dsearch{DATA/owners}{${lookup{owner}lsearch{DATA/owners/$value}}}{}}
FROM_DOMAIN  = ${lc:${domain:${address:$rh_from:}}}
OWNER_OF_FROM   = ${lookup{FROM_DOMAIN}dsearch{DATA/owners}{${lookup{owner}lsearch{DATA/owners/$value}}}{}}
# The sending limit of the account in $acl_m_account (recipients an hour;
# 0 is none).
LIMIT_OF_ACCOUNT = ${lookup{$acl_m_account}dsearch{DATA/accounts}{${lookup{limit}lsearch{DATA/accounts/$value}{$value}{0}}}{0}}
# True when outgoing mail goes through the relay host with a login.
RELAY_LOGIN = and{{eq{$router_name}{smarthost}}{exists{DATA/smarthost_auth}}}
SRS_SECRET = ${readfile{DATA/srs_secret}{}}
# Headers only LPanel writes: removed from whatever arrives.
SPAM_HEADERS = X-LPanel-Spam-Score : X-Spam-Score : X-Spam-Bar : X-Spam-Status : X-Spam-Flag

domainlist local_domains    = @ : localhost : localhost.localdomain : dsearch;DATA/local
domainlist relay_to_domains =
hostlist   relay_from_hosts = <; 127.0.0.1 ; ::1

acl_smtp_mail    = acl_check_mail
acl_smtp_rcpt    = acl_check_rcpt
acl_smtp_data    = acl_check_data
acl_not_smtp     = acl_check_not_smtp

daemon_smtp_ports    = 25 : 465 : 587
tls_on_connect_ports = 465
tls_advertise_hosts  = *
tls_certificate      = /etc/pki/lpanel-mail/host.crt
tls_privatekey       = /etc/pki/lpanel-mail/host.key
openssl_options      = +no_sslv2 +no_sslv3 +no_tlsv1 +no_tlsv1_1

# Spam and virus filtering: Rspamd (which asks ClamAV), for mail from
# outside, while DATA/filter is there.
spamd_address = 127.0.0.1 11333 variant=rspamd

# Logging in is offered only once the connection is encrypted (each
# authenticator says so).
auth_advertise_hosts = *

smtp_banner             = $smtp_active_hostname ESMTP
never_users             = root
host_lookup             = *
message_size_limit      = 50M
smtp_accept_max         = 100
smtp_accept_max_per_host = 20
split_spool_directory   = true
ignore_bounce_errors_after = 2d
timeout_frozen_after    = 7d
keep_environment        =
add_environment         = <; PATH=/usr/bin:/bin

log_selector = +smtp_protocol_error +smtp_syntax_error +tls_cipher \
               +received_recipients +sender_on_delivery +delivery_size \
               +outgoing_port +incoming_port


######################################################################
begin acl

acl_check_mail:
  deny    condition = ${if eq{$sender_helo_name}{}}
          message   = Say HELO first
  accept


acl_check_rcpt:
  # Local programs (the sendmail command): sites' PHP, cron, autoresponders.
  accept  hosts = :
          control = dkim_disable_verify

  deny    message     = Restricted characters in address
          domains     = +local_domains
          local_parts = ^[.] : ^.*[@%!/|]
  deny    message     = Restricted characters in address
          domains     = !+local_domains
          local_parts = ^[./|] : ^.*[@%!] : ^.*/\\.\\./

  accept  local_parts = postmaster
          domains     = +local_domains

  # The submission ports take mail only from a mailbox that logged in.
  deny    message   = Log in to send mail on this port
          condition = ${if inlist{$received_port}{465:587}}
          !authenticated = *

  # A suspended account's mailboxes send nothing. (Dovecot's "nologin"
  # stops their IMAP and POP3 logins, but not the logins Exim asks about.)
  deny    message   = This account is suspended
          authenticated = *
          condition = ${lookup{${lc:${domain:$authenticated_id}}}dsearch{DATA/owners}{${lookup{suspended}lsearch{DATA/owners/$value}{yes}{no}}}{no}}

  # A mailbox sends only as an address of its own account's domains.
  deny    message   = $sender_address is not an address of your account
          authenticated = *
          set acl_m_account = OWNER_OF_LOGIN
          condition = ${if or{{eq{$acl_m_account}{}}{!eq{$acl_m_account}{OWNER_OF_SENDER}}}}

  # The account's sending limit (its package's): recipients an hour, from
  # its mailboxes and its sites together.
  defer   message   = Your account has sent to its limit of $acl_m_limit recipients an hour; try again later
          authenticated = *
          set acl_m_limit = LIMIT_OF_ACCOUNT
          condition = ${if >{$acl_m_limit}{0}}
          ratelimit = $acl_m_limit / 1h / per_rcpt / $acl_m_account
          log_message = lpanel-limit: $acl_m_account reached $acl_m_limit recipients an hour

  accept  authenticated = *
          control = submission/sender_retain
          control = dkim_disable_verify

  require verify = sender

  accept  hosts   = +relay_from_hosts
          control = submission
          control = dkim_disable_verify

  require message = relay not permitted
          domains = +local_domains : +relay_to_domains
  require verify  = recipient
  accept


acl_check_data:
  deny    condition = ${if > {$max_received_linelength}{998}}
          message   = maximum allowed line length is 998 octets, got $max_received_linelength
  deny    !verify   = header_syntax
          message   = header syntax
          log_message = header syntax ($acl_verify_message)
  # A mailbox may not write another account's address in From:.
  deny    message   = The From: address belongs to another account
          authenticated = *
          set acl_m_account = OWNER_OF_LOGIN
          condition = ${if and{{!eq{OWNER_OF_FROM}{}}{!eq{OWNER_OF_FROM}{$acl_m_account}}}}
  # Mail is signed with the From: domain's key only when that domain is the
  # sender's own account's.
  warn    condition = ${if and{{!eq{$acl_m_account}{}}{eq{$acl_m_account}{OWNER_OF_FROM}}}}
          set acl_m_dkim = FROM_DOMAIN

  # Mail from outside, while filtering is on: Rspamd scores it. What
  # scores the server's rejection score, or carries a virus, is refused;
  # the rest gets its score (tenths, never below 0) in a header, which each
  # mailbox's Sieve script files spam by. The refusals log their recipients
  # (delivery tracking shows them to their accounts).
  warn    remove_header = SPAM_HEADERS
  accept  authenticated = *
  accept  hosts = +relay_from_hosts
  accept  condition = ${if !exists{DATA/filter}}
  accept  condition = ${if >{$message_size}{20M}}
  warn    spam = nobody:true/defer_ok
  deny    message   = This message carries a virus
          condition = ${if match{$spam_report}{CLAM_VIRUS}}
          log_message = refused, a virus for $recipients
  deny    message   = This message was refused as spam
          condition = ${if eq{$spam_action}{reject}}
          log_message = refused as spam (score $spam_score) for $recipients
  defer   message   = Please try again later
          condition = ${if eq{$spam_action}{soft reject}}
  warn    condition = ${if def:spam_score_int}
          add_header = X-LPanel-Spam-Score: ${if <{$spam_score_int}{0}{0}{$spam_score_int}}
          add_header = X-Spam-Score: $spam_score
          add_header = X-Spam-Bar: $spam_bar
  accept


acl_check_not_smtp:
  # The sendmail command, run as an account's user: its own domains' mail
  # is signed. ($sender_ident is the calling user's login name.)
  warn    set acl_m_account = $sender_ident
  warn    condition = ${if and{{!eq{$acl_m_account}{}}{eq{$acl_m_account}{OWNER_OF_FROM}}}}
          set acl_m_dkim = FROM_DOMAIN
  # The account's sending limit counts its sites' mail too (and what its
  # mailboxes' filters and autoresponders send).
  deny    message   = The account has sent to its limit of $acl_m_limit recipients an hour
          set acl_m_limit = LIMIT_OF_ACCOUNT
          condition = ${if >{$acl_m_limit}{0}}
          ratelimit = $acl_m_limit / 1h / per_rcpt / $acl_m_account
          log_message = lpanel-limit: $acl_m_account reached $acl_m_limit recipients an hour
  accept


######################################################################
begin routers

# Outgoing mail through the administrator's relay host, when one is set.
# Mail a forwarder sends on leaves with its sender rewritten (SRS), so the
# receiving server's SPF check passes.
smarthost:
  driver     = manualroute
  domains    = ! +local_domains
  condition  = ${if exists{DATA/smarthost}}
  route_data = ${readfile{DATA/smarthost}{}}
  transport  = ${if eq{$local_part@$domain}{$original_local_part@$original_domain}{remote_smtp}{remote_forwarded_smtp}}
  self       = send
  no_more

dnslookup:
  driver    = dnslookup
  domains   = ! +local_domains
  transport = ${if eq{$local_part@$domain}{$original_local_part@$original_domain}{remote_smtp}{remote_forwarded_smtp}}
  ignore_target_hosts = 0.0.0.0 : 127.0.0.0/8
  no_more

# A bounce to a rewritten (SRS) sender goes back to the original sender;
# one that only looks rewritten fails.
lpanel_srs:
  driver    = redirect
  senders   = :
  domains   = dsearch;DATA/local
  condition = ${if inbound_srs{$local_part}{SRS_SECRET}}
  data      = $srs_recipient

lpanel_srs_invalid:
  driver    = redirect
  senders   = :
  domains   = dsearch;DATA/local
  condition = ${if inbound_srs{$local_part}{}}
  allow_fail
  data      = :fail: Invalid SRS recipient address

# An address's forwarders; when the address is also a mailbox, a copy goes
# on to it as well. "info+news@" reaches "info@".
lpanel_forward:
  driver   = redirect
  domains  = dsearch;DATA/local
  local_part_suffix = +*
  local_part_suffix_optional
  data     = ${lookup{$local_part}lsearch{DATA/forwards/$domain_data}}
  unseen   = ${lookup{$local_part}lsearch{DATA/mailboxes/$domain_data}{yes}{no}}
  check_ancestor
  allow_fail
  allow_defer
  forbid_file
  forbid_pipe
  forbid_filter_reply
  forbid_include
  retry_use_local_part

lpanel_mailbox:
  driver    = accept
  domains   = dsearch;DATA/local
  local_part_suffix = +*
  local_part_suffix_optional
  condition = ${lookup{$local_part}lsearch{DATA/mailboxes/$domain_data}{yes}{no}}
  transport = dovecot_lmtp

# Any other address: the catch-all ("*"), or refused at RCPT time when the
# domain has none.
lpanel_catchall:
  driver   = redirect
  domains  = dsearch;DATA/local
  data     = ${lookup{*}lsearch{DATA/forwards/$domain_data}}
  check_ancestor
  allow_fail
  allow_defer
  forbid_file
  forbid_pipe
  forbid_filter_reply
  forbid_include

# The server's own name: system aliases and users (root's mail, cron).
system_aliases:
  driver  = redirect
  domains = @ : localhost : localhost.localdomain
  allow_fail
  allow_defer
  data    = ${lookup{$local_part}lsearch{/etc/aliases}}
  file_transport = address_file
  pipe_transport = address_pipe

localuser:
  driver    = accept
  domains   = @ : localhost : localhost.localdomain
  check_local_user
  transport = local_delivery
  cannot_route_message = Unknown user


######################################################################
begin transports

# Through the relay host with a login, TLS and the login are required.
remote_smtp:
  driver = smtp
  dkim_domain      = ${lookup{$acl_m_dkim}dsearch{DATA/dkim}{$value}{}}
  dkim_selector    = default
  dkim_private_key = ${if eq{$dkim_domain}{}{}{DATA/dkim/$dkim_domain}}
  dkim_canon       = relaxed
  dkim_hash        = sha256
  hosts_require_tls  = ${if RELAY_LOGIN{*}{}}
  hosts_require_auth = ${if RELAY_LOGIN{*}{}}

# Mail a forwarder sends on: its sender becomes an SRS address of the
# forwarding domain (bounces come back to lpanel_srs). One recipient at a
# time, since each may have been forwarded by another domain.
remote_forwarded_smtp:
  driver = smtp
  max_rcpt    = 1
  return_path = ${if !eq{$return_path}{}{${srs_encode{SRS_SECRET}{$return_path}{$original_domain}}}fail}
  dkim_domain      = ${lookup{$acl_m_dkim}dsearch{DATA/dkim}{$value}{}}
  dkim_selector    = default
  dkim_private_key = ${if eq{$dkim_domain}{}{}{DATA/dkim/$dkim_domain}}
  dkim_canon       = relaxed
  dkim_hash        = sha256
  hosts_require_tls  = ${if RELAY_LOGIN{*}{}}
  hosts_require_auth = ${if RELAY_LOGIN{*}{}}

dovecot_lmtp:
  driver    = lmtp
  socket    = /run/dovecot/lmtp-exim
  batch_max = 200

local_delivery:
  driver = appendfile
  file   = /var/mail/$local_part_data
  delivery_date_add
  envelope_to_add
  return_path_add
  group  = mail
  mode   = 0660

address_pipe:
  driver = pipe
  return_output

address_file:
  driver = appendfile
  delivery_date_add
  envelope_to_add
  return_path_add


######################################################################
begin retry

*   *   F,2h,15m; G,16h,1h,1.5; F,4d,6h


######################################################################
begin rewrite


######################################################################
begin authenticators

# Mailbox logins, checked by Dovecot; offered only over TLS.
dovecot_plain:
  driver        = dovecot
  public_name   = PLAIN
  server_socket = /run/dovecot/auth-exim
  server_set_id = ${lc:$auth1}
  server_advertise_condition = ${if def:tls_in_cipher}

dovecot_login:
  driver        = dovecot
  public_name   = LOGIN
  server_socket = /run/dovecot/auth-exim
  server_set_id = ${lc:$auth1}
  server_advertise_condition = ${if def:tls_in_cipher}

# The login to the relay host (the transports use it only there, and only
# over TLS). The agent writes it ready to send: "^user^password".
lpanel_relay:
  driver      = plaintext
  public_name = PLAIN
  client_send = ${readfile{DATA/smarthost_auth}}
