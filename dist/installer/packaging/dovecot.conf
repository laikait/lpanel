######################################################################
# Dovecot for LPanel. Written by the installer; changes here are
# replaced when the installer runs again. It replaces the system's
# configuration whole: only mailboxes in /etc/dovecot/lpanel log in, never
# the server's own users.
#
#   passwd.d/<domain>       each mailbox's login, uid, home and quota (lpa)
#   sieve/<domain>/*.sieve  blocked senders, spam, filters and autoresponders,
#                           run before the owner's own (lpa)
#   sso.d/<domain>          webmail sign-on passwords, each for a few hours (lpa)
#   sni.conf                each mail domain's own certificate (lpa)
#
# Mail is kept in the account's home (~/mail/<domain>/<local>/Maildir),
# written as the account's user.
######################################################################

protocols = imap pop3 lmtp
listen = *, ::
login_greeting = Ready.

ssl = required
ssl_cert = </etc/pki/lpanel-mail/host.crt
ssl_key = </etc/pki/lpanel-mail/host.key
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes
# Each mail domain's own certificate for mail.<domain> (lpa writes it and
# reloads Dovecot).
!include_try /etc/dovecot/lpanel/sni.conf

disable_plaintext_auth = yes
auth_mechanisms = plain login
auth_username_format = %Lu
# Failed logins are logged with the address they came from (brute-force
# blocking reads them).
auth_verbose = yes

first_valid_uid = 1000
first_valid_gid = 1000
mail_location = maildir:~/Maildir
mail_plugins = $mail_plugins quota
pop3_uidl_format = %08Xu%08Xv

namespace inbox {
  inbox = yes
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}

passdb {
  driver = passwd-file
  args = scheme=BLF-CRYPT username_format=%n /etc/dovecot/lpanel/passwd.d/%d
}
# Webmail's single sign-on: a random password the panel asked for, good for
# a few hours, accepted beside the mailbox's own. Every domain has the file
# (empty when nobody signed on); the mailbox itself still comes from
# passwd.d above, so a removed mailbox cannot sign on.
passdb {
  driver = passwd-file
  args = scheme=SSHA256 username_format=%n /etc/dovecot/lpanel/sso.d/%d
}
userdb {
  driver = passwd-file
  args = username_format=%n /etc/dovecot/lpanel/passwd.d/%d
}

# Exim checks logins here and delivers here.
service auth {
  unix_listener auth-exim {
    mode = 0660
    user = exim
    group = exim
  }
}
service lmtp {
  unix_listener lmtp-exim {
    mode = 0600
    user = exim
    group = exim
  }
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
  postmaster_address = postmaster@LPANEL_HOSTNAME
}
protocol imap {
  mail_plugins = $mail_plugins imap_quota
  mail_max_userip_connections = 20
}

plugin {
  quota = count:Mailbox
  quota_vsizes = yes
  quota_grace = 10%%
  sieve_before = /etc/dovecot/lpanel/sieve/%d/%n.sieve
  sieve = file:~/sieve;active=~/.dovecot.sieve
  sieve_max_redirects = 4
  # A filter's forwarded copy leaves with the mailbox's own address as its
  # sender (so SPF passes, and bounces come back to the mailbox).
  sieve_redirect_envelope_from = recipient
}
