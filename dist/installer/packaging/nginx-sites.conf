# Installed by LPanel as /etc/nginx/nginx.conf when nginx serves customers'
# sites (install.sh --web=nginx or --web=hybrid). The package's own file is
# kept as /etc/nginx/nginx.conf.lpanel-orig.
#
# The sites themselves are the agent's: /etc/nginx/conf.d/lpanel.conf (log
# format, the default site) includes one file per account from
# /etc/nginx/lpanel/sites/. The panel runs its own nginx (lpanel-nginx) with
# its own configuration; this one serves only customers' sites.

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    server_tokens off;

    # Each site logs to its account's own file (the agent's lpanel.conf).
    access_log off;

    include /etc/nginx/conf.d/*.conf;
}
