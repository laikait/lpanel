# Every request to the panel's front controller. No other PHP file is ever run.
fastcgi_pass unix:/run/lpanel/php-fpm.sock;
include /etc/nginx/fastcgi_params;
fastcgi_param SCRIPT_FILENAME /usr/local/lpanel/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /usr/local/lpanel/public;
fastcgi_param HTTPS on;
fastcgi_param HTTP_PROXY "";
fastcgi_read_timeout 120s;
